spring.application.name=payments

server.port=8082

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=payments-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.template.default-topic=new_orders
spring.kafka.listener.auth-exception-retry-interval=1000
spring.kafka.listener.idle-event-interval=10000

spring.kafka.producer.retries=3
spring.kafka.retry.topic.backoff.delay=1000
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.acks=all
logging.level.org.apache.kafka=INFO

spring.kafka.admin.auto-create=true
app.kafka.payments.topic=new_payment
app.kafka.topic.partitions=3

